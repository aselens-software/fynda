services:
  fynda-db:
    image: mongo:7
    container_name: fynda-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 123asd123
      MONGO_INITDB_DATABASE: fynda
    volumes:
      - fynda-mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  fynda-bot:
    build: .
    container_name: fynda-bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      fynda-db:
        condition: service_healthy

volumes:
  fynda-mongo-data:
